<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARME LUNETTES - Sistema Central</title>
    <style>
        body { font-family: sans-serif; background-color: #f1f5f9; padding: 20px; color: #334155; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 900px) { .container { grid-template-columns: 1fr; } }
        .main-panel { background: white; padding: 25px; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .aside-panel { background: #0f172a; color: white; padding: 20px; border-radius: 12px; height: fit-content; }
        h1 { color: #0f172a; margin-top: 0; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        h2 { font-size: 16px; text-transform: uppercase; color: #94a3b8; margin-top: 0; }
        h3 { font-size: 14px; text-transform: uppercase; color: #475569; margin-bottom: 10px; margin-top: 0; }
        .box { background: #f8fafc; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px; }
        .box-blue { background: #eff6ff; border-color: #bfdbfe; }
        .box-green { background: #ecfdf5; border-color: #a7f3d0; }
        .box-amber { background: #fff7ed; border-color: #ffedd5; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 8px; }
        input, select { width: 100%; border: 1px solid #cbd5e1; padding: 10px; border-radius: 6px; box-sizing: border-box; font-size: 14px; background: white; }
        label { font-size: 11px; font-weight: bold; color: #64748b; display: block; margin-bottom: 3px; text-transform: uppercase; }
        button { width: 100%; background: #0f172a; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1e293b; }
        .btn-add { background: #ea580c; padding: 10px; font-size: 14px; margin-top: 0; }
        .stock-item { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding: 8px 0; font-size: 13px; }
        .hidden { display: none !important; }
        .item-row { display: flex; justify-content: space-between; background: white; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; margin-top: 5px; font-size: 13px; }
        @media print {
            body *, .container { display: none !important; }
            #ticket-impresion, #ticket-impresion * { display: block !important; }
            #ticket-impresion { font-family: monospace; font-size: 13px; color: black; background: white; width: 100%; }
        }
        #ticket-impresion { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <h1>👓 CHARME LUNETTES</h1>
            <form id="formVenta">
                <!-- 1. Datos del Cliente -->
                <div class="box">
                    <h3>1. Datos del Cliente</h3>
                    <div class="grid-2">
                        <div><label>Nombre Completo</label><input type="text" id="cliente" required placeholder="Ej. Juan Pérez"></div>
                        <div><label>Teléfono / Celular</label><input type="tel" id="telefono" placeholder="Ej. 11 2345-6789"></div>
                    </div>
                </div>

                <!-- 2. Cristales y Armazón -->
                <div class="box box-blue">
                    <h3>2. Cristales y Armazón</h3>
                    <div class="grid-2">
                        <div>
                            <label>Armazón del Stock</label>
                            <select id="selectMarco" onchange="actualizarPrecioMarco()">
                                <option value="">-- Sin Armazón Nuevo --</option>
                            </select>
                        </div>
                        <div><label>Precio Armazón (\$)</label><input type="number" id="p_marco" value="0" min="0"></div>
                    </div>
                    <div class="grid-2" style="margin-top: 10px;">
                        <div>
                            <label>Tipo de Cristal</label>
                            <select id="tipo_cristal">
                                <option value="Monofocal">👁️ Monofocal</option>
                                <option value="Bifocal">👓 Bifocal</option>
                                <option value="Multifocal">💎 Multifocal</option>
                            </select>
                        </div>
                        <div><label>Precio Cristales (\$)</label><input type="number" id="p_cristal" value="0" min="0"></div>
                    </div>
                </div>

                <!-- 3. Receta Médica y Medidas -->
                <div class="box box-blue">
                    <h3>🩺 3. Receta Médica y Medidas Clínicas</h3>
                    <div>
                        <span style="font-size: 11px; font-weight: bold; color: #1e40af;">OJO DERECHO (OD)</span>
                        <div class="grid-4">
                            <div><label>Esférico</label><input type="number" step="0.25" id="od_esf" placeholder="0.00"></div>
                            <div><label>Cilíndrico</label><input type="number" step="0.25" id="od_cil" placeholder="0.00"></div>
                            <div><label>Eje°</label><input type="number" id="od_eje" placeholder="0°"></div>
                            <div><label>D.I. (mm)</label><input type="number" step="0.5" id="od_di" placeholder="D.I."></div>
                        </div>
                        <div class="grid-2" style="margin-top: 5px; grid-template-columns: 1fr 3fr;">
                            <div><label>Altura (mm)</label><input type="number" step="0.5" id="od_alt" placeholder="Alt."></div>
                            <div><label>Tratamiento / Material del Cristal</label><input type="text" id="od_trat" placeholder="Ej. Policarbonato Antirreflex"></div>
                        </div>
                    </div>
                    <div style="margin-top: 15px; border-top: 1px dashed #bfdbfe; pt: 10px; padding-top: 10px;">
                        <span style="font-size: 11px; font-weight: bold; color: #1e40af;">OJO IZQUIERDO (OI)</span>
                        <div class="grid-4">
                            <div><label>Esférico</label><input type="number" step="0.25" id="oi_esf" placeholder="0.00"></div>
                            <div><label>Cilíndrico</label><input type="number" step="0.25" id="oi_cil" placeholder="0.00"></div>
                            <div><label>Eje°</label><input type="number" id="oi_eje" placeholder="0°"></div>
                            <div><label>D.I. (mm)</label><input type="number" step="0.5" id="oi_di" placeholder="D.I."></div>
                        </div>
                        <div class="grid-2" style="margin-top: 5px; grid-template-columns: 1fr 3fr;">
                            <div><label>Altura (mm)</label><input type="number" step="0.5" id="oi_alt" placeholder="Alt."></div>
                            <div><label>Tratamiento / Material del Cristal</label><input type="text" id="oi_trat" placeholder="Ej. Orgánico Filtro Azul"></div>
                        </div>
                    </div>
                </div>
