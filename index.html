<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARME LUNETTES - Sistema Central</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        @media print {
            body *, #app-container { display: none !important; }
            #ticket-impresion, #ticket-impresion * { display: block !important; }
            #ticket-impresion { width: 100%; max-width: 80mm; margin: 0; padding: 10px; font-family: monospace; font-size: 12px; color: black; background: white; }
        }
        #ticket-impresion { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans min-h-screen p-2 md:p-6">
    <div id="app-container" class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-6">
            <main class="bg-white shadow-lg rounded-xl p-4 md:p-6 border border-slate-200">
                <div class="flex items-center space-x-2 mb-6">
                    <span class="text-3xl">Anterior👓</span>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900">CHARME LUNETTES</h1>
                        <p class="text-xs text-gray-500">Planilla Integral de Carga de Ventas</p>
                    </div>
                </div>
                <form id="formVenta" class="space-y-5">
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <h3 class="text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">1. Datos del Cliente</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" id="cliente" required class="w-full border bg-white p-2.5 rounded-lg text-sm" placeholder="Nombre Completo">
                            <input type="tel" id="telefono" class="w-full border bg-white p-2.5 rounded-lg text-sm" placeholder="Teléfono / Celular">
                        </div>
                    </div>
                    <div class="bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                        <h3 class="text-sm font-bold text-blue-800 mb-3 uppercase tracking-wider">🩺 Receta Médica</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" step="0.25" id="od_esf" placeholder="OD Esf" class="border p-2 rounded-lg text-sm text-center bg-white">
                            <input type="number" step="0.25" id="od_cil" placeholder="OD Cil" class="border p-2 rounded-lg text-sm text-center bg-white">
                            <input type="number" id="od_eje" placeholder="OD Eje°" class="border p-2 rounded-lg text-sm text-center bg-white">
                        </div>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-200 space-y-3">
                        <h3 class="text-sm font-bold text-emerald-800 uppercase tracking-wider">2. Liquidación y Cierre</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="precio_base_anteojo" class="border bg-white p-2.5 rounded-lg text-sm" placeholder="Precio Total \$">
                            <input type="number" id="monto_sena" class="border bg-white p-2.5 rounded-lg text-sm" placeholder="Seña \$ (Hoy)">
                        </div>
                        <select id="metodo_pago" class="w-full border p-2.5 rounded-lg bg-white text-sm">
                            <option value="Efectivo">💵 Efectivo</option>
                            <option value="Transferencia">📱 Transferencia / Mercado Pago</option>
                        </select>
                        <select id="estado_trabajo" class="w-full border p-2.5 rounded-lg bg-white text-sm">
                            <option value="Pendiente">⏳ Pendiente (Taller)</option>
                            <option value="Entregado">✅ Entregado Completo</option>
                        </select>
                    </div>
                    <button type="submit" id="btnSubmit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-4 rounded-xl text-md">
                        🚀 Finalizar Venta e Imprimir Comprobante
                    </button>
                </form>
            </main>
        </div>
        <aside class="bg-slate-900 text-slate-100 shadow-lg rounded-xl p-4 md:p-6 flex flex-col h-fit">
            <h2 class="text-md font-bold tracking-wide uppercase text-slate-400 mb-2">📦 Existencias en Salón</h2>
            <div id="listaStock" class="text-xs space-y-1">Cargando existencias de armazones...</div>
        </aside>
    </div>
    <div id="ticket-impresion">
        <h2 style="text-align:center;">CHARME LUNETTES</h2>
        <p>-----------------------------------</p>
        <p><strong>Cliente:</strong> <span id="t_cliente"></span></p>
        <p><strong>Total:</strong> \$<span id="t_total"></span></p>
        <p><strong>Seña:</strong> \$<span id="t_sena"></span></p>
        <p><strong>Saldo:</strong> \$<span id="t_saldo"></span></p>
    </div>
    <script>
        const API_BASE = window.location.origin;
        async function cargarProductos() {
            try {
                const r = await fetch(`${API_BASE}/api/productos`);
                const d = await r.json();
                const lista = document.getElementById('listaStock');
                lista.innerHTML = "";
                d.marcos.forEach(m => {
                    lista.innerHTML += `<div class="flex justify-between border-b border-slate-800 py-1"><span>👓 ${m.marca} (${m.modelo})</span> <b>${m.stock} u.</b></div>`;
                });
            } catch(e) { console.error(e); }
        }
        document.getElementById('formVenta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const total = parseFloat(document.getElementById('precio_base_anteojo').value) || 0;
            const sena = parseFloat(document.getElementById('monto_sena').value) || 0;
            document.getElementById('t_cliente').innerText = document.getElementById('cliente').value;
            document.getElementById('t_total').innerText = total.toFixed(2);
            document.getElementById('t_sena').innerText = sena.toFixed(2);
            document.getElementById('t_saldo').innerText = (total - sena).toFixed(2);
            window.print();
            document.getElementById('formVenta').reset();
            cargarProductos();
        });
        window.onload = cargarProductos;
    </script>
</body>
</html>
